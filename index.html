<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Skyline – Weather Forecast</title>

  <meta name="description"
    content="Skyline is a simple weather forecast app. Search any city to see the current temperature and a 7-day forecast." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌤️</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet" />

  <!-- One CSS file per feature area = fewer merge conflicts -->
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/search.css" />
  <link rel="stylesheet" href="css/current.css" />
  <link rel="stylesheet" href="css/forecast.css" />
  <link rel="stylesheet" href="css/settings.css" />
</head>

<body data-sky="clear">
  <main class="app">
    <header class="app__header">
      <h1 class="app__title">Skyline</h1>
      <!-- FEATURE 4 mounts here -->
      <div id="settings" class="slot"></div>
    </header>

    <!-- FEATURE 1 mounts here -->
    <section id="search" class="slot" aria-label="Search city"></section>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <!-- FEATURE 2 mounts here -->
    <section id="current" class="slot" aria-label="Current weather"></section>

    <!-- FEATURE 3 mounts here -->
    <section id="forecast" class="slot" aria-label="Forecast"></section>
  </main>

  <script type="module" src="js/main.js"></script>
</body>

</html>
